<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow"><meta name="referrer" content="no-referrer">
<title>書く｜日記</title>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; connect-src 'self' https://diary-auth.ueda-photo-11.workers.dev; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; font-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'self'">
<link rel="stylesheet" href="assets/style.css"><link rel="stylesheet" href="assets/minimal.css">
</head>
<body class="simple-page editor-page">
<header class="simple-top"><div class="simple-width simple-top-inner">
<a href="index.html" class="simple-logo">日記</a>
<nav class="simple-nav"><a href="editor.html" aria-current="page">書く</a><a href="preview.html">確認</a><a href="index.html" target="_blank" rel="noopener">公開</a></nav>
</div></header>
<div class="simple-width simple-editor">
<aside class="simple-aside"><div class="simple-aside-head"><h2>記事</h2><button type="button" id="new-entry" class="small-button">＋ 新規</button></div>
<div id="draft-list" class="draft-list"></div><details class="simple-published"><summary>公開済み</summary><div id="published-list" class="draft-list"></div></details></aside>
<main class="simple-edit-main">
<form id="entry-form" class="simple-paper" autocomplete="off">
<div class="simple-date-row"><label class="visually-hidden" for="entry-date">日付</label><input type="date" id="entry-date" required><span id="draft-indicator" class="simple-status"></span></div>
<label class="visually-hidden" for="entry-title">タイトル</label><input id="entry-title" class="simple-title-input" placeholder="タイトル" maxlength="140" required>
<label class="visually-hidden" for="entry-body">本文</label><textarea id="entry-body" class="simple-body-input" placeholder="ここに書く…" required></textarea>
<details class="simple-options"><summary>詳細</summary><div class="simple-extra">
<div><label for="entry-weather">天気</label><input id="entry-weather" class="editor-input" placeholder="天気"></div>
<div><label for="entry-mood">ひとこと</label><input id="entry-mood" class="editor-input" placeholder="ひとこと"></div>
<div class="simple-extra-wide"><label for="entry-tags">タグ</label><input id="entry-tags" class="editor-input" placeholder="写真，散歩"></div>
</div></details>
<div class="simple-actions"><button id="save-entry" type="submit" class="action-button primary">保存</button><button id="open-preview" type="button" class="action-button">確認</button><button id="delete-entry" type="button" class="action-button quiet">削除</button></div>
<p id="save-status" class="status-message" role="status" aria-live="polite"></p>
</form>
<section class="simple-paper simple-photo-section"><div class="simple-section-title"><h2>写真</h2><button id="select-photos" type="button" class="small-button">＋ 追加</button></div>
<div id="photo-drop" class="simple-photo-drop"><span>ここに写真をドロップ</span><input id="photo-picker" type="file" accept="image/*" multiple hidden></div>
<div id="photo-list" class="photo-list"></div><p id="photo-status" class="status-message" role="status"></p></section>

<section class="simple-paper simple-publish-section" id="site-name-section" aria-labelledby="site-name-heading">
<div class="simple-section-title"><h2 id="site-name-heading">サイトの名前</h2></div>
<p class="simple-status">公開ページの大きな見出しだけを変更します．左上の小さい「日記」と記事のタイトルは変わりません．</p>
<div class="simple-extra-wide">
<label for="site-name-input">表示する言葉</label>
<input id="site-name-input" type="text" class="editor-input" placeholder="日記" maxlength="80" autocomplete="off">
</div>
<div class="simple-actions"><button type="button" class="action-button primary" id="save-site-name">サイト名を公開する</button></div>
<p class="status-message" id="site-name-status" role="status" aria-live="polite"></p>
</section>
<section class="simple-paper simple-publish-section" id="publish-section"><div class="simple-section-title"><h2>公開</h2><span id="login-status" class="simple-status">未接続</span></div>
<div class="simple-actions simple-publish-actions"><button id="github-login" type="button" class="action-button">GitHubでログイン</button><button id="github-logout" type="button" class="action-button quiet" hidden>ログアウト</button><button id="publish-github" type="button" class="action-button primary">公開する</button><button id="export-zip" type="button" class="action-button">ZIP出力</button><button id="delete-published" type="button" class="action-button quiet" hidden>公開を削除</button></div>
<p id="login-help" class="simple-status" aria-live="polite"></p><p id="publish-status" class="status-message" role="status" aria-live="polite"></p>

</section>
</main></div>
<script src="assets/editor-redirect.js?v=4" defer></script>
<script src="assets/storage.js?v=3" defer></script><script src="assets/auth-config.js?v=20261122-2" defer></script><script src="assets/auth.js?v=3" defer></script><script src="assets/editor.js?v=8" defer></script>
</body></html>
