name: SNmap data validation (manual only)
# No scheduled or push-triggered execution.
# This workflow never commits or deploys; output is a private workflow artifact.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Retrieve data for review (no publication)
        run: python3 snmap/scripts/update_feed.py
      - name: Save proposed JSON as workflow artifact only
        uses: actions/upload-artifact@v4
        with:
          name: snmap-data-review
          path: snmap/data/snmap-live.json
          retention-days: 7
