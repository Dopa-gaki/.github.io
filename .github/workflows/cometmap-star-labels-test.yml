name: Cometmap HYG star labels test (one-off)
on:
  push:
    paths:
      - '.github/workflows/cometmap-star-labels-test.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Extract proper names, Bayer and Flamsteed labels
        run: python cometmap/scripts/build_star_labels.py
      - name: Commit only test overlay data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cometmap/star-labels/hyg-labels.json
          if ! git diff --cached --quiet; then
            git commit -m "Build HYG star designation lookup for isolated Cometmap test"
            git push origin HEAD:main
          fi
