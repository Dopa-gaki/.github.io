name: Publish daily diary site
on:
  push:
    branches: [main]
    paths:
      - 'diary/.payload4'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract diary files
        run: |
          python3 - <<'PY'
          import base64, json, lzma
          from pathlib import Path
          chunks = [Path(f"diary/.payload{i}") for i in range(1,5)]
          if not all(x.is_file() for x in chunks):
              print("Source chunks absent, nothing to deploy.")
              raise SystemExit(0)
          data = ''.join(x.read_text(encoding='ascii').strip() for x in chunks)
          files = json.loads(lzma.decompress(base64.b64decode(data)))
          for path, content in files.items():
              rel = Path(path)
              if rel.is_absolute() or '..' in rel.parts:
                  raise ValueError('Invalid relative path')
              target = Path('diary') / rel
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content, encoding='utf-8')
          for chunk in chunks:
              chunk.unlink()
          print(f"Extracted {len(files)} diary files")
          PY
      - name: Commit diary files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A diary/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Publish daily diary site"
          git pull --rebase origin main
          git push origin main
